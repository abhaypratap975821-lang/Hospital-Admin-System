{% extends 'navigation_bar.html' %}
{% load static %}

{% block body %}

<style>
    /* ---------- Login Page ---------- */

    .login-page {
        min-height: calc(100vh - 72px);
        background: #f6f8fb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .login-wrapper {
        width: 100%;
        max-width: 430px;
    }

    /* ---------- Header ---------- */

    .login-heading {
        text-align: center;
        margin-bottom: 25px;
    }

    .login-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: #e6f7f5;
        color: #16a394;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 27px;
    }

    .login-heading h2 {
        margin: 0;
        color: #111827;
        font-size: 26px;
        font-weight: 700;
    }

    .login-heading p {
        margin: 7px 0 0;
        color: #6b7280;
        font-size: 14px;
    }

    /* ---------- Login Card ---------- */

    .login-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 8px 30px rgba(17, 24, 39, 0.07);
    }

    /* ---------- Form ---------- */

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 15px;
        pointer-events: none;
    }

    .login-input {
        width: 100%;
        height: 46px;
        border: 1px solid #d9dee7;
        border-radius: 7px;
        padding: 0 14px 0 42px;
        font-size: 14px;
        color: #111827;
        background: #fff;
        outline: none;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .login-input:focus {
        border-color: #16a394;
        box-shadow: 0 0 0 3px rgba(22, 163, 148, 0.10);
    }

    .login-input::placeholder {
        color: #9ca3af;
    }

    /* ---------- Login Button ---------- */

    .login-btn {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 7px;
        background: #16a394;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 5px;
    }

    .login-btn:hover {
        background: #128f83;
        box-shadow: 0 5px 14px rgba(22, 163, 148, 0.20);
        transform: translateY(-1px);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    /* ---------- Security Text ---------- */

    .security-text {
        text-align: center;
        margin-top: 20px;
        color: #9ca3af;
        font-size: 12px;
    }

    .security-text i {
        color: #16a394;
        margin-right: 5px;
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 576px) {

        .login-page {
            padding: 25px 15px;
        }

        .login-card {
            padding: 25px 20px;
        }

        .login-heading h2 {
            font-size: 23px;
        }
    }
</style>


<!-- ================= LOGIN PAGE ================= -->

<div class="login-page">

    <div class="login-wrapper">

        <!-- Heading -->

        <div class="login-heading">

            <div class="login-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h2>Admin Login</h2>

            <p>Sign in to access the hospital management system</p>

        </div>


        <!-- Login Card -->

        <div class="login-card">

            <form method="post">

                {% csrf_token %}


                <!-- Username -->

                <div class="form-group">

                    <label class="form-label" for="username">
                        Admin Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="login-input"
                            placeholder="Enter admin name"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="login-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- Login Button -->

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>
                    Login
                </button>

            </form>


            <!-- Security -->

            <div class="security-text">
                <i class="fa-solid fa-shield-halved"></i>
                Secure administrator access
            </div>

        </div>

    </div>

</div>


<!-- ================= SUCCESS / ERROR ================= -->

{% if error == "no" %}

<script>
    alert("Logged in Successfully");
    window.location.href = "{% url 'home' %}";
</script>

{% endif %}


{% if error == "yes" %}

<script>
    alert("Invalid Login Credential");
</script>

{% endif %}


{% endblock %}
